<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSU Survey Dashboard</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: #10934F;
      --secondary-color: #2D5A27;
      --sidebar-color: #2D5A27;
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      color: white;
      padding: 1.5rem 2rem;
      box-shadow: var(--shadow-lg);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo {
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .header-title h1 {
      font-size: 1.5rem;
      margin: 0;
    }

    .header-title p {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    /* Layout */
    .layout {
      display: flex;
      flex: 1;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--sidebar-color);
      color: white;
      min-height: 100%;
      flex-shrink: 0;
    }

    .sidebar-header {
      background: rgba(0, 0, 0, 0.2);
      padding: 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      color: #d1d5db;
    }

    .sidebar-menu {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .sidebar-menu li {
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-menu a {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      color: #d1d5db;
      text-decoration: none;
      transition: 0.3s;
      border-left: 4px solid transparent;
    }

    .sidebar-menu a:hover,
    .sidebar-menu a.active {
      background: rgba(16, 147, 79, 0.3);
      color: white;
      border-left: 4px solid var(--primary-color);
    }

    .sidebar-menu i {
      width: 20px;
      text-align: center;
    }

    /* Main content */
    .main-content {
      flex: 1;
      padding: 2rem;
      background: white;
    }

    /* Survey Card */
    .survey-card {
      max-width: 300px;
      margin: auto;
      background: #49bc4b;
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      padding: 1.5rem;
      border: 1px solid #e5e7eb;
      margin-left: 100px;
    }

    .survey-card h2 {
      margin: 0 0 1rem 0;
      font-size: 1.2rem;
      color: white  ;
      text-align: center;
    }

    .survey-list a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      border-radius: 8px;
      text-decoration: none;
      color: #333;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      transition: 0.3s;
    }

    .survey-list a:hover {
      background: #e6f4ec;
      border-color: var(--primary-color);
      color: var(--primary-color);
    }

    .survey-list i {
      color: var(--primary-color);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-content">
      <div class="logo">
        <i class="fas fa-graduation-cap"></i>
      </div>
      <div class="header-title">
        <h1>Survey Analytics Dashboard</h1>
        <p>Caraga State University - Cabadbaran City</p>
      </div>
    </div>
  </div>

  <div class="layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">Navigation</div>
      <ul class="sidebar-menu">
        <li>
          <a href="#">
            <i class="fas fa-chart-line"></i>
            Dashboard Overview
          </a>
        </li>
        <li>
          <a href="#" class="active">
            <i class="fas fa-poll"></i>
            Manage Survey
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fas fa-cogs"></i>
            Settings
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fas fa-sign-out-alt"></i>
            Logout
          </a>
        </li>
      </ul>
    </div>

    <!-- Main content -->
    <div class="main-content">
      <div class="survey-card">
        <h2>Available Surveys</h2>
        <div class="survey-list">
          <a href="{% url 'msurvey1' %}"><span>Survey 1</span><i class="fas fa-arrow-right"></i></a>
          <a href="{% url 'msurvey2' %}"><span>Survey 2</span><i class="fas fa-arrow-right"></i></a>
          <a href="{% url 'msurvey3' %}"><span>Survey 3</span><i class="fas fa-arrow-right"></i></a>
        </div>
      </div>
    </div>
  </div> 
</body>
</html>
