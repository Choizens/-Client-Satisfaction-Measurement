{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ survey.intro_title }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-image: url("{% static 'pictures/Background.svg' %}");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body class="m-0 p-0 font-sans min-h-screen flex flex-col">
    <div>
        <img src="{% static 'pictures/header-logo.svg' %}" alt="Logo" class="h-16 m-4">
    </div>

  <!-- Main -->
  <main class="flex-1 flex justify-center items-start px-4 py-12">
    <div class="bg-white/95 rounded-2xl p-6 md:p-8 shadow-xl w-full max-w-3xl backdrop-blur-sm">

      <!-- Intro -->
      <div class="bg-gray-100/90 p-4 md:p-6 mb-8 border-l-[5px] border-[#164F29]">
        <h3 class="text-[#164F29] font-bold text-lg mb-4">
          {{ survey.intro_title }}
        </h3>
        <p class="text-gray-800 leading-relaxed mb-2">
          {{ survey.intro_desc1|safe }}
        </p>
        <p class="text-gray-800 leading-relaxed">
          {{ survey.intro_desc2|safe }}
        </p>
      </div>

      <!-- Form -->
      <form id="satisfactionSurvey" method="POST" action="{% url 'page1' %}" class="space-y-6">
      {% csrf_token %}

      <!-- Row 1 -->
      <div class="grid md:grid-cols-3 gap-4">
        <div class="flex flex-col">
          <label for="clientType" class="font-semibold text-gray-700 mb-2">{{ survey.client_type_label }}</label>
          <select id="clientType" name="clientType" required 
            class="p-3 border-2 border-gray-300 focus:border-[#164F29] focus:ring-2 focus:ring-[#164F29]/20">
            <option value="">Select</option>
            {% for option in survey.client_type_options %}
              <option value="{{ option|slugify }}" {% if form_data.clientType == option|slugify %}selected{% endif %}>
                {{ option }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="flex flex-col">
          <label for="government" class="font-semibold text-gray-700 mb-2">{{ survey.government_label }}</label>
          <select id="government" name="government" required
            class="p-3 border-2 border-gray-300 focus:border-[#164F29] focus:ring-2 focus:ring-[#164F29]/20">
            <option value="">Select</option>
            {% for option in survey.government_options %}
              <option value="{{ option|slugify }}" {% if form_data.government == option|slugify %}selected{% endif %}>
                {{ option }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="flex flex-col">
          <label for="visitDate" class="font-semibold text-gray-700 mb-2">{{ survey.visit_date_label }}</label>
          <input type="date" id="visitDate" name="visitDate" required
            value="{{ form_data.visitDate|default:'' }}"
            class="p-3 border-2 border-gray-300 focus:border-[#164F29] focus:ring-2 focus:ring-[#164F29]/20">
        </div>
      </div>

      <!-- Row 2 -->
      <div class="grid md:grid-cols-2 gap-4">
        <div class="flex flex-col">
          <label for="sex" class="font-semibold text-gray-700 mb-2">{{ survey.sex_label }}</label>
          <select id="sex" name="sex" required
            class="p-3 border-2 border-gray-300 focus:border-[#164F29] focus:ring-2 focus:ring-[#164F29]/20">
            <option value="">Select</option>
            {% for option in survey.sex_options %}
              <option value="{{ option|slugify }}" {% if form_data.sex == option|slugify %}selected{% endif %}>
                {{ option }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="flex flex-col">
          <label for="age" class="font-semibold text-gray-700 mb-2">{{ survey.age_label }}</label>
          <input type="number" id="age" name="age" min="1" max="120" placeholder="Enter age" required
            value="{{ form_data.age|default:'' }}"
            class="p-3 border-2 border-gray-300 focus:border-[#164F29] focus:ring-2 focus:ring-[#164F29]/20">
        </div>
      </div>

      <!-- Row 3 -->
      <div class="grid md:grid-cols-2 gap-4">
        <div class="flex flex-col">
          <label for="region" class="font-semibold text-gray-700 mb-2">{{ survey.region_label }}</label>
          <input type="text" id="region" name="region" placeholder="Enter your region" required
            value="{{ form_data.region|default:'' }}"
            class="p-3 border-2 border-gray-300 focus:border-[#164F29] focus:ring-2 focus:ring-[#164F29]/20">
        </div>

        <div class="flex flex-col">
          <label for="officePerson" class="font-semibold text-gray-700 mb-2">{{ survey.office_person_label }}</label>
          <input type="text" id="officePerson" name="officePerson" placeholder="Enter office/person visited" required
            value="{{ form_data.officePerson|default:'' }}"
            class="p-3 border-2 border-gray-300 focus:border-[#164F29] focus:ring-2 focus:ring-[#164F29]/20">
        </div>
      </div>

      <!-- Row 4 -->
      <div>
        <label for="serviceAvailed" class="font-semibold text-gray-700 mb-2">{{ survey.service_availed_label }}</label>
        <textarea id="serviceAvailed" name="serviceAvailed" rows="3" required
          class="w-full p-3 border-2 border-gray-300 focus:border-[#164F29] focus:ring-2 focus:ring-[#164F29]/20">{{ form_data.serviceAvailed|default:'' }}</textarea>
      </div>

      <!-- Submit -->
      <div class="text-center">
        <button type="submit" 
          class="bg-[#10934F] hover:bg-[#5a9935] text-white font-bold text-lg h-14 w-40 transition transform hover:-translate-y-1">
          {{ survey.submit_text }}
        </button>
      </div>
    </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-[#10934F]/90 h-[50px] mt-auto"></footer>

</body>
</html>
